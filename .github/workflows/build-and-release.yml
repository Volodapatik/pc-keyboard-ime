name: Build APK and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: |
          # Create gradlew if missing (we only have properties)
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9 || true
          fi
          chmod +x gradlew || true

      - name: Build debug APK
        run: |
          # Use gradle directly if wrapper not ready
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"
          ls -la app/build/outputs/apk/ || true

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: pc-keyboard-apk
          path: ${{ steps.find_apk.outputs.apk_path }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: PC Keyboard v1.0.${{ github.run_number }}
          body: |
            Автоматичний реліз PC Keyboard IME
            
            **Що всередині:**
            - F1–F12
            - Ctrl / Alt / Win / Esc
            - Повна QWERTY + стрілки
            
            Встанови APK → увімкни в налаштуваннях клавіатур.
          files: ${{ steps.find_apk.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
